<!doctype html>
<!--
dashboard.html — 파이 웹 대시보드 (http://파이IP:8090/)
  왼쪽: 카메라 화면(관절 표시)   오른쪽: 지금 인식, 동작 녹화·학습
  0.5초마다 /api/state 를 물어봐서 화면을 갱신해요.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제스처 대시보드</title>
<style>
  :root { --bg:#121212; --panel:#1c1c1c; --line:#2c2c2c; --text:#fff; --sub:#a7a7a7; --accent:#1ed760; --danger:#ff6b6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 14px; }
  h2 { font-size: 14px; margin-bottom: 8px; }
  .sub { color: var(--sub); font-size: 12px; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 16px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: 12px; padding: 14px; }
  .cam { position: relative; padding: 0; overflow: hidden; }
  .cam img { display: block; width: 100%; }
  .count { position: absolute; inset: 0; display: none; place-items: center; font-size: 72px; font-weight: 800; background: rgba(0,0,0,.45); }
  .count.on { display: grid; }
  .now { font-size: 28px; font-weight: 800; color: var(--accent); min-height: 42px; }
  .bar { height: 6px; border-radius: 3px; background: #333; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; background: #0e0e0e; color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2c2c2c; color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: #363636; }
  button.primary { background: var(--accent); color: #000; font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); }
  td.n { text-align: right; color: var(--sub); }
  td.d { width: 1px; }
  .del { background: none; color: var(--danger); height: 28px; padding: 0 6px; }
  .known { color: var(--accent); font-size: 11px; margin-left: 6px; }
  .msg { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--sub); min-height: 18px; white-space: pre-line; }
  code { background: #0e0e0e; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>제스처 대시보드</h1>
  <div class="wrap">
    <div class="card cam">
      <img src="/stream" alt="카메라">
      <div class="count" id="count"></div>
    </div>

    <div class="side">
      <div class="card">
        <h2>지금 인식</h2>
        <div class="now" id="now">-</div>
        <div class="sub" id="nowSub"></div>
        <div class="bar"><i id="hold"></i></div>
      </div>

      <div class="card">
        <h2>동작 녹화</h2>
        <div class="sub">이름을 적고 녹화를 누르면 3초 뒤부터 5초 동안 그 동작을 모아요. 조금씩 움직이며 여러 각도로 해 주세요.
          맥 노치 설정의 제스처 이름과 같게 적으면 돼요 (예: <code>rock</code>).
          <b><code>_none</code></b> 은 "아무것도 안 하는 평소 모습"이에요. 꼭 녹화하세요.</div>
        <div class="row" style="margin-top:10px">
          <input id="name" placeholder="예) rock" list="names">
          <datalist id="names"><option value="_none"><option value="rock"><option value="pop"><option value="hiphop"><option value="jazz"><option value="play_pause"><option value="like"></datalist>
          <button class="primary" id="rec">녹화</button>
        </div>
        <table id="table"></table>
        <div class="row" style="margin-top:12px">
          <button id="train" style="flex:1">학습하기</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (url, body) => fetch(url, { method: 'POST', body: JSON.stringify(body || {}) }).then((r) => r.json());

  // 서버 상태를 화면에 그리기
  function draw(s) {
    $('now').textContent = s.action || '-';
    $('nowSub').textContent = s.action ? `확신도 ${(s.prob * 100).toFixed(0)}%` : (s.classes.length ? '아는 동작이 안 보여요' : '아직 학습한 동작이 없어요');
    $('hold').style.width = `${s.progress * 100}%`;

    // 녹화 카운트다운 / 진행
    const c = $('count');
    if (s.recording) {
      c.classList.add('on');
      c.textContent = s.recording.countdown > 0 ? Math.ceil(s.recording.countdown) : `● ${s.recording.got}`;
    } else c.classList.remove('on');
    $('rec').disabled = !!s.recording;
    $('train').disabled = s.training;

    // 동작 목록
    const rows = Object.entries(s.counts).sort();
    $('table').innerHTML = rows.length
      ? rows.map(([n, k]) => `<tr><td>${n}${s.classes.includes(n) ? '<span class="known">학습됨</span>' : ''}</td><td class="n">${k}개</td><td class="d"><button class="del" data-n="${n}">삭제</button></td></tr>`).join('')
      : '<tr><td class="sub">아직 녹화한 동작이 없어요</td></tr>';
    document.querySelectorAll('.del').forEach((b) => (b.onclick = async () => {
      if (!confirm(`'${b.dataset.n}' 샘플을 지울까요? (학습은 다시 해야 해요)`)) return;
      await post('/api/delete', { name: b.dataset.n });
    }));
    if (s.message) $('msg').textContent = s.message;
  }

  $('rec').onclick = async () => {
    const name = $('name').value.trim();
    if (!name) return ($('msg').textContent = '이름을 적어 주세요');
    const r = await post('/api/record', { name, seconds: 5 });
    if (!r.ok) $('msg').textContent = r.reason;
  };
  $('train').onclick = async () => {
    $('msg').textContent = '학습 중…';
    await post('/api/train');
  };

  setInterval(() => fetch('/api/state').then((r) => r.json()).then(draw).catch(() => {}), 500);
</script>
</body>
</html>

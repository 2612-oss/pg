<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OLED 3개 연결 도면</title>
<!-- OLED 3개(SSD1306, I2C) ↔ 라즈베리파이 40핀 연결 도면 (1600×1040). oled-wiring.html 과 같은 모양 -->
<style>
  @font-face { font-family: "Pretendard"; src: local("Pretendard Variable"), local("Pretendard"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1040px; overflow: hidden; background: #191919; }
  svg { display: block; font-family: "Pretendard", sans-serif; }
  .t { fill: #fff; } .s { fill: #9b9b98; } .m { font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 1040" width="1600" height="1040" id="svg">
  <text x="100" y="78" class="t" font-size="38" font-weight="800" letter-spacing="-1">OLED 3개 연결 도면</text>
  <text x="100" y="112" class="s" font-size="18">화면마다 다른 I2C 선 · 같은 색 핀끼리 연결 · 1번 화면은 지금 꽂혀 있는 그대로</text>

  <rect x="150" y="150" width="560" height="830" rx="24" fill="#16372a" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
  <text x="395" y="186" text-anchor="end" class="s" font-size="15" font-weight="600">안쪽 줄</text>
  <text x="465" y="186" class="s" font-size="15" font-weight="600">바깥쪽 줄 (가장자리)</text>
  <rect x="390" y="200" width="80" height="756" rx="12" fill="#0b0b0b"/>
  <g id="pins"></g>
  <g id="cards"></g>
</svg>
<script>
  const NAME = { 1: '3.3V', 2: '5V', 3: 'GPIO2', 4: '5V', 5: 'GPIO3', 6: 'GND', 7: 'GPIO4', 8: 'GPIO14', 9: 'GND', 10: 'GPIO15',
    11: 'GPIO17', 12: 'GPIO18', 13: 'GPIO27', 14: 'GND', 15: 'GPIO22', 16: 'GPIO23', 17: '3.3V', 18: 'GPIO24', 19: 'GPIO10', 20: 'GND',
    21: 'GPIO9', 22: 'GPIO25', 23: 'GPIO11', 24: 'GPIO8', 25: 'GND', 26: 'GPIO7', 27: 'ID_SD', 28: 'ID_SC', 29: 'GPIO5', 30: 'GND',
    31: 'GPIO6', 32: 'GPIO12', 33: 'GPIO13', 34: 'GND', 35: 'GPIO19', 36: 'GPIO16', 37: 'GPIO26', 38: 'GPIO20', 39: 'GND', 40: 'GPIO21' };
  const SCREENS = [
    { n: 1, page: '곡 화면', bus: 'I2C 1', color: '#4da3ff', pins: { VCC: 1, GND: 6, SCL: 5, SDA: 3 }, note: '지금 꽂혀 있는 그대로' },
    { n: 2, page: '시계 화면', bus: 'I2C 3', color: '#ff9f43', pins: { VCC: 17, GND: 9, SCL: 13, SDA: 11 } },
    { n: 3, page: '가사 화면', bus: 'I2C 5', color: '#ff6bcb', pins: { VCC: 17, GND: 25, SCL: 31, SDA: 29 }, note: '가사 없으면 상태 · VCC 는 17번을 2번과 나눠 써요' },
  ];
  const FAN = { 4: '5V', 12: 'GPIO18', 14: 'GND' };
  const use = {}; // 핀 번호 → [{ screen, role }]
  for (const s of SCREENS) for (const [role, pin] of Object.entries(s.pins)) (use[pin] ||= []).push({ s, role });

  const NS = 'http://www.w3.org/2000/svg';
  const make = (parent, tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    document.getElementById(parent).append(e);
    return e;
  };

  for (let pin = 1; pin <= 40; pin++) {
    const outer = pin % 2 === 0, row = Math.ceil(pin / 2) - 1;
    const x = outer ? 450 : 410, y = 218 + row * 37.6;
    const u = use[pin], fan = FAN[pin];
    const fill = u ? u[0].s.color : fan ? '#5a5a5a' : '#8a7a45';
    if (u && u.length > 1) make('pins', 'circle', { cx: x, cy: y, r: 16, fill: 'none', stroke: u[1].s.color, 'stroke-width': 4 });
    if (pin === 1) make('pins', 'rect', { x: x - 12, y: y - 12, width: 24, height: 24, rx: 3, fill });
    else make('pins', 'circle', { cx: x, cy: y, r: 12, fill });
    make('pins', 'text', { x, y: y + 4, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 800, fill: '#111', class: 'm' }, pin);
    let label, color, weight = 600;
    if (u) {
      label = u.map((v) => `화면${v.s.n} ${v.role}`).join(' · ');
      color = u[0].s.color; weight = 800;
    } else if (fan) {
      label = `팬 ${fan}`; color = '#7a7a7a';
    } else {
      label = NAME[pin]; color = '#5f5f5c';
    }
    const at = outer ? { x: x + 26, 'text-anchor': 'start' } : { x: x - 26, 'text-anchor': 'end' };
    make('pins', 'text', { ...at, y: y + 5, 'font-size': u ? 15 : 13, 'font-weight': weight, fill: color }, label);
  }
  make('pins', 'text', { x: 430, y: 1005, 'text-anchor': 'middle', 'font-size': 14, class: 's' }, '1번 핀 = 네모 납땜 · SD카드 쪽 끝 · 회색 = 팬이 쓰는 핀');

  // 오른쪽: 화면마다 카드
  SCREENS.forEach((s, i) => {
    const top = 150 + i * 285, left = 790;
    make('cards', 'rect', { x: left, y: top, width: 710, height: 255, rx: 22, fill: '#202020', stroke: s.color, 'stroke-width': 2 });
    // OLED 모듈 그림
    make('cards', 'rect', { x: left + 28, y: top + 28, width: 200, height: 160, rx: 12, fill: '#1d4f9c' });
    make('cards', 'rect', { x: left + 44, y: top + 74, width: 168, height: 96, rx: 4, fill: '#050505' });
    make('cards', 'text', { x: left + 128, y: top + 132, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 800, fill: s.color }, s.n);
    ['GND', 'VCC', 'SCL', 'SDA'].forEach((r, k) => {
      const px = left + 68 + k * 40;
      make('cards', 'circle', { cx: px, cy: top + 46, r: 9, fill: '#c9a94b' });
      make('cards', 'text', { x: px, y: top + 214, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: '#d6d6d3', class: 'm' }, r);
    });
    make('cards', 'text', { x: left + 260, y: top + 60, 'font-size': 26, 'font-weight': 800, class: 't' }, `${s.n}번 · ${s.page}`);
    make('cards', 'text', { x: left + 262, y: top + 88, 'font-size': 15, class: 's' }, `${s.bus}${s.note ? ' · ' + s.note : ''}`);
    ['GND', 'VCC', 'SCL', 'SDA'].forEach((r, k) => {
      const y = top + 128 + k * 30;
      make('cards', 'text', { x: left + 262, y, 'font-size': 18, 'font-weight': 800, fill: '#d6d6d3', class: 'm' }, r);
      make('cards', 'text', { x: left + 330, y, 'font-size': 18, class: 's' }, '→');
      make('cards', 'text', { x: left + 362, y, 'font-size': 18, 'font-weight': 800, fill: s.color }, `${s.pins[r]}번`);
      make('cards', 'text', { x: left + 425, y, 'font-size': 16, class: 's' }, NAME[s.pins[r]]);
    });
  });
</script>
</body>
</html>

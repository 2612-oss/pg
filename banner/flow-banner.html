<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>흐름 배너</title>
<!-- 노션 본문용 가로 배너 (1600×340). 배경을 노션 다크 모드(#191919)와 맞춰서 페이지에 녹아들게 -->
<style>
  @font-face { font-family: "Pretendard"; src: local("Pretendard Variable"), local("Pretendard"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 340px; overflow: hidden; background: #191919; }
  body { font-family: "Pretendard", sans-serif; color: #fff; display: grid; place-items: center; }

  .box { position: relative; width: 1560px; height: 300px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #121212 0%, #0c0c0c 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .box::before { content: ""; position: absolute; width: 900px; height: 300px; left: 50%; top: 60%; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(139,108,255,.16), transparent); }

  .label { position: absolute; left: 44px; top: 30px; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #8b6cff; }
  .label span { color: #7a7a7a; margin-left: 12px; letter-spacing: .02em; font-weight: 500; }

  .flow { position: absolute; left: 44px; right: 44px; top: 82px; display: flex; align-items: center; }
  .step { flex: 0 0 226px; height: 176px; border-radius: 18px; padding: 20px 22px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); position: relative; }
  .step.hi { background: rgba(139,108,255,.08); border-color: rgba(139,108,255,.45); }
  .num { font-size: 13px; font-weight: 700; color: #6d6d6d; }
  .step.hi .num { color: #8b6cff; }
  .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin: 10px 0 12px;
    background: rgba(255,255,255,.06); }
  .step.hi .ico { background: #8b6cff; }
  .ico svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .step.hi .ico svg { stroke: #000; }
  .t { font-size: 21px; font-weight: 750; letter-spacing: -.02em; }
  .d { font-size: 14px; color: #9b9b9b; margin-top: 4px; line-height: 1.4; }

  .arrow { flex: 1; height: 2px; margin: 0 14px; position: relative;
    background: repeating-linear-gradient(90deg, #3a3a3a 0 6px, transparent 6px 12px); }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left: 8px solid #3a3a3a; }
  .arrow.g { background: repeating-linear-gradient(90deg, #8b6cff 0 6px, transparent 6px 12px); }
  .arrow.g::after { border-left-color: #8b6cff; }
  .arrow em { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-style: normal; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: #8a8a8a; background: #141414; padding: 3px 8px; border-radius: 6px; border: 1px solid #2a2a2a; }
  .arrow.g em { color: #8b6cff; border-color: rgba(139,108,255,.35); }
</style>
</head>
<body>
  <div class="box">
    <div class="label">HOW IT WORKS<span>손짓이 음악이 되기까지</span></div>
    <div class="flow">
      <div class="step">
        <div class="num">01</div>
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></div>
        <div class="t">웹캠</div>
        <div class="d">OpenCV 로 영상 입력</div>
      </div>
      <div class="arrow"><em>프레임</em></div>
      <div class="step">
        <div class="num">02</div>
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v6m0 0-4 6m4-6 4 6M6 10l6-1 6 1"/></svg></div>
        <div class="t">관절 추출</div>
        <div class="d">MediaPipe<br>몸 33점 · 손 21점</div>
      </div>
      <div class="arrow"><em>좌표 61개</em></div>
      <div class="step hi">
        <div class="num">03</div>
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5m0-1V4a1.5 1.5 0 0 1 3 0v6m0-1V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.5-1.5L7 13"/></svg></div>
        <div class="t">동작 인식</div>
        <div class="d">scikit-learn 분류<br>1초 유지 · 오작동 방지</div>
      </div>
      <div class="arrow g"><em>"rock"</em></div>
      <div class="step">
        <div class="num">04</div>
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 5h4v1.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM8 20h8"/></svg></div>
        <div class="t">맥 노치</div>
        <div class="d">제스처 → 장르 결정<br>플레이리스트 검색</div>
      </div>
      <div class="arrow g"><em>재생</em></div>
      <div class="step">
        <div class="num">05</div>
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 9.5c3-1 6.5-.7 9 .8M8 12.6c2.5-.7 5.3-.4 7.4.8M8.6 15.4c2-.5 4.1-.3 5.8.6"/></svg></div>
        <div class="t">Spotify</div>
        <div class="d">락 플레이리스트 재생<br>OLED 에 곡 표시</div>
      </div>
    </div>
  </div>
</body>
</html>
